<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EtherSentry | Galería</title>
    <link rel="stylesheet" href="style.css"> <style>
        /* Estilos EXCLUSIVOS para la galería */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 40px;
        }

        .photo-card {
            border: 2px solid #bd93f9; /* Tu borde morado */
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .photo-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #bd93f9;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* El MODAL (Ventana emergente) */
        .modal {
            display: none; /* Oculto por defecto */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9); /* Fondo negro semitransparente */
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            max-width: 80%;
            max-height: 80%;
            border: 2px solid #50fa7b; /* Borde verde al abrir */
            box-shadow: 0 0 20px #50fa7b;
        }

        .caption {
            margin-top: 15px;
            color: #f8f8f2;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            text-align: center;
            background: #000;
            padding: 10px;
            border-radius: 5px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        /* --- ESTILOS DE LA BARRA DE NAVEGACIÓN --- */
.cyber-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: rgba(15, 15, 22, 0.95); /* Fondo oscuro semitransparente */
    padding: 15px 30px;
    border-bottom: 2px solid #bd93f9; /* Línea morada abajo */
    position: sticky; /* Se queda pegada arriba al bajar */
    top: 0;
    z-index: 1000; /* Siempre encima de todo */
    backdrop-filter: blur(5px); /* Efecto difuminado estilo Garuda */
}

.nav-logo {
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 1.5rem;
    color: #f8f8f2;
    text-shadow: 0 0 5px #50fa7b; /* Brillo verde */
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 20px;
    margin: 0;
    padding: 0;
}

.nav-links li a {
    text-decoration: none;
    color: #8be9fd; /* Azul cian */
    font-family: 'Courier New', monospace;
    font-weight: bold;
    transition: all 0.3s ease;
    padding: 5px 10px;
    border: 1px solid transparent;
}

/* Efecto al pasar el mouse (Hover) */
.nav-links li a:hover {
    color: #50fa7b; /* Se pone verde */
    border: 1px solid #50fa7b; /* Cuadro verde */
    box-shadow: 0 0 10px #50fa7b;
    background-color: rgba(80, 250, 123, 0.1);
}

/* Enlace activo (donde estás ahora) */
.nav-links li a.active {
    color: #bd93f9;
    border-bottom: 2px solid #bd93f9;
}
    </style>
</head>
<body>
    <nav class="cyber-nav">
    <div class="nav-logo">
        <span style="color: #50fa7b;">➜</span> ETHER_SENTRY
    </div>
    <ul class="nav-links">
        <li><a href="index.html" class="active">/ROOT</a></li>
        <li><a href="galeria.html">/GALERÍA</a></li>
        <li><a href="#proyectos">/PROYECTOS</a></li>
        <li><a href="frarerodriguezr.com">/CONTACTO</a></li>
    </ul>
</nav>
    <nav style="padding: 20px; text-align: left;">
        <a href="index.html" style="color: #bd93f9; text-decoration: none; font-size: 1.2rem;">⬅ Volver a la Base</a>
    </nav>

    <h1 style="text-align: center; color: #50fa7b;">Galería Visual</h1>
    <p style="text-align: center;">Colección de Productos y Paisajes</p>

    <div class="gallery-container">
        
        <div class="photo-card" onclick="openModal(this)" 
             data-desc="Mega Charizard X UPC | Canon Rebel T5 | ISO 100 | 50mm">
            <img src="tu_foto_1.jpg" alt="Charizard">
        </div>

        <div class="photo-card" onclick="openModal(this)" 
             data-desc="Kyurem Black | Luz Natural | F/1.8">
            <img src="tu_foto_2.jpg" alt="Kyurem">
        </div>

        <div class="photo-card" onclick="openModal(this)" 
             data-desc="Inspección de Calidad | Microscopio Digital">
            <img src="tu_foto_3.jpg" alt="Inspeccion">
        </div>

    </div>

    <div id="myModal" class="modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="img01">
        <div id="caption" class="caption"></div>
    </div>

    <script>
        // Javascript simple para abrir/cerrar
        function openModal(element) {
            var modal = document.getElementById("myModal");
            var modalImg = document.getElementById("img01");
            var captionText = document.getElementById("caption");
            
            // Sacamos la info de la tarjeta que clickeaste
            var img = element.querySelector('img');
            var desc = element.getAttribute('data-desc');

            modal.style.display = "flex";
            modalImg.src = img.src;
            captionText.innerHTML = "► DATOS: " + desc;
        }

        function closeModal() {
            document.getElementById("myModal").style.display = "none";
        }
    </script>

</body>
</html>
