<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EtherSentry | Visual Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        /* --- TUS VARIABLES & PALETA ORIGINALES --- */
        :root {
            --bg-dark: #0f0f16;
            --bg-panel: #191924;
            --retro-purple: #bd93f9; 
            --retro-green: #50fa7b;  
            --retro-blue: #8be9fd;   
            --text-main: #f8f8f2;
            --text-dim: #6272a4;
            --font-pixel: 'VT323', monospace; 
            --font-body: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* --- EFECTO CRT (SCANLINES) --- */
        body::before {
            content: " "; display: block; position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 9999; background-size: 100% 3px, 3px 100%; pointer-events: none;
        }

        h1, h2, h3, .pixel-font { font-family: var(--font-pixel); letter-spacing: 1px; }
        a { text-decoration: none; color: inherit; transition: 0.2s; }
        ul { list-style: none; }

        .container { max-width: 1200px; /* Un poco más ancho para galería */ margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

        /* --- TU BARRA DE NAVEGACIÓN --- */
        .cyber-nav {
            display: flex; justify-content: space-between; align-items: center;
            background-color: rgba(15, 15, 22, 0.95);
            padding: 15px 30px;
            border-bottom: 2px solid #bd93f9;
            position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .nav-logo {
            font-family: 'Courier New', monospace; font-weight: bold; font-size: 1.5rem;
            color: #f8f8f2; text-shadow: 0 0 5px #50fa7b;
        }

        .nav-links { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }

        .nav-links li a {
            text-decoration: none; color: #8be9fd;
            font-family: 'Courier New', monospace; font-weight: bold;
            transition: all 0.3s ease; padding: 5px 10px; border: 1px solid transparent;
        }

        .nav-links li a:hover {
            color: #50fa7b; border: 1px solid #50fa7b;
            box-shadow: 0 0 10px #50fa7b; background-color: rgba(80, 250, 123, 0.1);
        }

        .nav-links li a.active { color: #bd93f9; border-bottom: 2px solid #bd93f9; }

        /* --- TUS CLASES DE TARJETAS (REUTILIZADAS) --- */
        .section-title { 
            font-size: 2.5rem; margin-bottom: 40px; color: var(--retro-blue); 
            border-bottom: 4px solid var(--retro-purple); display: inline-block; margin-top: 40px;
        }

        .project-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }

        .pixel-card {
            background: var(--bg-panel); border: 2px solid #333; transition: 0.3s;
            position: relative; overflow: hidden; cursor: pointer;
        }
        .pixel-card:hover {
            border-color: var(--retro-green); transform: translateY(-5px);
            box-shadow: 8px 8px 0px rgba(80, 250, 123, 0.2);
        }

        .card-img-container {
            width: 100%; height: 250px; /* Altura fija para fotos */
            background: #000; border-bottom: 2px solid #333;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .card-img-container img {
            width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s;
        }
        .pixel-card:hover .card-img-container img { transform: scale(1.1); }

        .card-content { padding: 20px; }
        .tag { 
            background: var(--retro-purple); color: #000; 
            font-family: var(--font-pixel); padding: 2px 8px; font-size: 0.9rem;
            display: inline-block; margin-bottom: 10px;
        }

        /* --- ESTILOS EXTRA SOLO PARA EL MODAL (Necesario para ver fotos en grande) --- */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(15, 15, 22, 0.98);
            justify-content: center; align-items: center; flex-direction: column;
        }
        .modal-content {
            max-width: 90%; max-height: 80vh;
            border: 2px solid var(--retro-green);
            box-shadow: 0 0 20px rgba(80, 250, 123, 0.2);
        }
        .close-btn {
            position: absolute; top: 30px; right: 40px; color: var(--text-main);
            font-family: var(--font-pixel); font-size: 3rem; cursor: pointer;
        }
        .modal-caption {
            margin-top: 20px; color: var(--text-main); font-family: var(--font-pixel); font-size: 1.5rem;
            background: var(--bg-panel); padding: 10px 20px; border-left: 4px solid var(--retro-purple);
        }
    </style>
</head>
<body>

    <nav class="cyber-nav">
        <div class="nav-logo">
            <span style="color: #50fa7b;">➜</span> ETHER_SENTRY
        </div>
        <ul class="nav-links">
            <li><a href="index.html">/ROOT</a></li>
            <li><a href="galeria.html" class="active">/GALERÍA</a></li> <li><a href="index.html#proyectos">/PROYECTOS</a></li>
            <li><a href="mailto:tuemail@gmail.com">/CONTACTO</a></li>
        </ul>
    </nav>

    <div class="container">
        
        <header style="border-bottom: 2px dashed var(--retro-purple); padding: 40px 0; text-align: center; display: block;">
            <div class="logo pixel-font" style="font-size: 3rem;">VISUAL_DATABASE</div>
            <div class="pixel-font" style="color: var(--text-dim);">[ SYSTEM LOGS: PHOTO & RENDER ]</div>
        </header>

        <section style="margin-top: 40px;">
            <h2 class="section-title pixel-font">ARCHIVOS DE IMAGEN</h2>

            <div class="project-grid">
                
                <article class="pixel-card" onclick="openModal(this)" data-desc="Luffy Gear 5 - Iluminación Neón Magenta">
                    <div class="card-img-container">
                        <img src="luffy.jpg" alt="Luffy">
                    </div>
                    <div class="card-content">
                        <span class="tag" style="background: var(--retro-blue);">FOTOGRAFÍA</span>
                        <h3 class="pixel-font" style="font-size: 1.5rem;">Cyber Luffy</h3>
                    </div>
                </article>

                <article class="pixel-card" onclick="openModal(this)" data-desc="Carta TCG Yu-Gi-Oh - Detalle Foil">
                    <div class="card-img-container">
                        <img src="cartas.jpg" alt="Cartas">
                    </div>
                    <div class="card-content">
                        <span class="tag" style="background: var(--retro-green);">MACRO</span>
                        <h3 class="pixel-font" style="font-size: 1.5rem;">TCG Eria Foil</h3>
                    </div>
                </article>

                <article class="pixel-card" onclick="openModal(this)" data-desc="Terminal Garuda Linux con Fastfetch">
                    <div class="card-img-container">
                        <img src="setup.jpg" alt="Terminal"> </div>
                    <div class="card-content">
                        <span class="tag" style="background: var(--retro-purple);">LINUX</span>
                        <h3 class="pixel-font" style="font-size: 1.5rem;">Workstation</h3>
                    </div>
                </article>

                </div>
        </section>

        <footer style="margin-top: 80px; padding: 40px 0; text-align: center; border-top: 2px dashed var(--text-dim); font-family: var(--font-pixel); color: var(--text-dim);">
            <p>END OF LOGS</p>
        </footer>

    </div>

    <div id="myModal" class="modal">
        <span class="close-btn" onclick="closeModal()">X</span>
        <img class="modal-content" id="img01">
        <div id="caption" class="modal-caption"></div>
    </div>

    <script>
        function openModal(card) {
            const modal = document.getElementById("myModal");
            const img = card.querySelector('img');
            const desc = card.getAttribute('data-desc');
            
            document.getElementById("img01").src = img.src;
            document.getElementById("caption").innerHTML = "> " + desc;
            modal.style.display = "flex";
        }
        function closeModal() {
            document.getElementById("myModal").style.display = "none";
        }
        window.onclick = function(e) {
            if (e.target == document.getElementById("myModal")) closeModal();
        }
    </script>

</body>
</html>
