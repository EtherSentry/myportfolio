<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EtherSentry | Galería Profesional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
    
    <style>
        /* --- 1. ESTÉTICA GENERAL (FONDO OSCURO) --- */
        body {
            background-color: #0f0f16; /* Negro azulado profundo */
            color: #f8f8f2;
            font-family: 'VT323', monospace;
            font-size: 1.2rem; /* Aumentamos un poco porque esta letra es más pequeña */
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* --- 2. BARRA DE NAVEGACIÓN SUPERIOR (MENU) --- */
        .cyber-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(15, 15, 22, 0.95); /* Fondo oscuro semitransparente */
            padding: 15px 40px;
            border-bottom: 1px solid #bd93f9; /* Línea morada sutil */
            position: sticky; /* Se queda pegada arriba al bajar */
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(5px); /* Efecto cristal */
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f8f8f2;
            letter-spacing: 1px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 25px;
            margin: 0;
            padding: 0;
        }

        .nav-links li a {
            text-decoration: none;
            color: #6272a4; /* Gris azulado (Inactivo) */
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
            padding-bottom: 5px;
        }

        /* Efecto Hover y Activo */
        .nav-links li a:hover, 
        .nav-links li a.active {
            color: #50fa7b; /* Verde neón */
            border-bottom: 2px solid #50fa7b;
            text-shadow: 0 0 8px rgba(80, 250, 123, 0.4);
        }

        /* --- 3. ENCABEZADO DE LA GALERÍA --- */
        .gallery-header {
            text-align: center;
            padding: 60px 20px 30px;
        }

        .gallery-header h1 {
            color: #8be9fd; /* Azul Cian */
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(139, 233, 253, 0.3);
        }

        .gallery-header p {
            color: #bd93f9;
            font-size: 1rem;
        }

        /* --- 4. GRILLA DE TARJETAS (GRID) --- */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px 60px 80px; /* Margen inferior amplio */
            max-width: 1400px;
            margin: 0 auto;
        }

        .photo-card {
            background-color: #1a1a24;
            border: 1px solid #44475a;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .photo-card:hover {
            transform: translateY(-5px);
            border-color: #50fa7b; /* Borde verde al pasar mouse */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        /* Contenedor de imagen (Corte perfecto) */
        .img-wrapper {
            width: 100%;
            height: 250px;
            overflow: hidden;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            opacity: 0.9;
        }

        .photo-card:hover img {
            transform: scale(1.1);
            opacity: 1;
        }

        /* Información de la tarjeta */
        .card-info {
            padding: 15px;
            border-top: 1px solid #282a36;
        }

        .card-title {
            display: block;
            font-size: 1.1rem;
            font-weight: bold;
            color: #f8f8f2;
            margin-bottom: 5px;
        }

        .card-tech {
            display: block;
            font-size: 0.8rem;
            color: #6272a4; /* Texto técnico gris */
        }

        /* --- 5. MODAL (VISOR DE FOTOS) --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 15, 22, 0.98);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            max-width: 90%;
            max-height: 80vh;
            border: 2px solid #50fa7b;
            box-shadow: 0 0 40px rgba(80, 250, 123, 0.1);
            border-radius: 4px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #fff;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .close-btn:hover { color: #ff5555; }

        .modal-caption {
            margin-top: 20px;
            color: #f8f8f2;
            font-size: 1.1rem;
            background: #282a36;
            padding: 10px 20px;
            border-radius: 4px;
            border-left: 4px solid #bd93f9;
        }
    </style>
</head>
<body>

    <nav class="cyber-nav">
        <div class="nav-logo">
            <span style="color: #50fa7b;">➜</span> ETHER_SENTRY
        </div>
        <ul class="nav-links">
            <li><a href="index.html">/ROOT</a></li>
            <li><a href="galeria.html" class="active">/GALERÍA</a></li> <li><a href="index.html#proyectos">/PROYECTOS</a></li>
            <li><a href="mailto:tuemail@gmail.com">/CONTACTO</a></li>
        </ul>
    </nav>

    <header class="gallery-header">
        <h1>Registros Visuales</h1>
        <p>[ Fotografía de Producto / Ingeniería / Coleccionismo ]</p>
    </header>

    <div class="gallery-container">
        
        <div class="photo-card" onclick="openModal(this)" data-desc="Mega Charizard X - Iluminación de Estudio">
            <div class="img-wrapper">
                <img src="charizard.jpg" alt="Charizard UPC">
            </div>
            <div class="card-info">
                <span class="card-title">Mega Charizard X</span>
                <span class="card-tech">Canon Rebel T5 | 50mm | ISO 100</span>
            </div>
        </div>

        <div class="photo-card" onclick="openModal(this)" data-desc="Kyurem Black - Render de Terminal">
            <div class="img-wrapper">
                <img src="kyurem.png" alt="Kyurem">
            </div>
            <div class="card-info">
                <span class="card-title">Project Kyurem</span>
                <span class="card-tech">Digital Asset | High Contrast</span>
            </div>
        </div>

        <div class="photo-card" onclick="openModal(this)" data-desc="Estación de Trabajo Garuda Linux">
            <div class="img-wrapper">
                <img src="setup.jpg" alt="Setup">
            </div>
            <div class="card-info">
                <span class="card-title">Workstation</span>
                <span class="card-tech">Garuda Linux | Dr460nized</span>
            </div>
        </div>

        </div>

    <div id="myModal" class="modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="img01">
        <div id="caption" class="modal-caption"></div>
    </div>

    <script>
        function openModal(card) {
            const modal = document.getElementById("myModal");
            const modalImg = document.getElementById("img01");
            const captionText = document.getElementById("caption");
            
            const img = card.querySelector('img');
            const desc = card.getAttribute('data-desc');

            modal.style.display = "flex";
            modalImg.src = img.src;
            captionText.innerHTML = "► SYSTEM LOG: " + desc;
        }

        function closeModal() {
            document.getElementById("myModal").style.display = "none";
        }
        
        window.onclick = function(event) {
            const modal = document.getElementById("myModal");
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
