<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EtherSentry | Galería Profesional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
    
    <style>
        /* --- 1. AJUSTE DE TAMAÑO (ESCALA) --- */
        body {
            background-color: #0f0f16;
            color: #f8f8f2;
            font-family: 'VT323', monospace; 
            font-size: 1.5rem; /* Aumentado de 1.2 a 1.5 para que no se vea chico */
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        a { text-decoration: none; transition: all 0.3s ease; }

        /* --- 2. BARRA DE NAVEGACIÓN (MÁS GRANDE Y BRILLANTE) --- */
        .cyber-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(15, 15, 22, 0.95);
            padding: 25px 50px; /* Más padding para que la barra sea más alta */
            border-bottom: 2px solid #bd93f9;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .nav-logo {
            font-size: 2.2rem; /* Logo mucho más grande */
            font-weight: 400; /* Las fuentes pixel no necesitan negrita */
            color: #f8f8f2;
            letter-spacing: 2px;
            /* EL RESALTADO VERDE (GLOW) */
            text-shadow: 0 0 10px rgba(80, 250, 123, 0.7); 
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 40px; /* Más espacio entre botones */
            margin: 0;
            padding: 0;
        }

        .nav-links li a {
            color: #8be9fd;
            font-size: 1.4rem; /* Enlaces más grandes */
            padding-bottom: 5px;
            border-bottom: 2px solid transparent;
        }

        .nav-links li a:hover {
            color: #50fa7b;
            text-shadow: 0 0 15px #50fa7b; /* Brillo fuerte al pasar mouse */
        }

        .nav-links li a.active {
            color: #50fa7b;
            border-bottom: 2px solid #50fa7b;
            text-shadow: 0 0 10px rgba(80, 250, 123, 0.5);
        }

        /* --- 3. ENCABEZADO DE GALERÍA (MÁS IMPONENTE) --- */
        .gallery-header {
            text-align: center;
            padding: 80px 20px 50px; /* Más espacio arriba */
        }

        .gallery-header h1 {
            color: #8be9fd;
            font-size: 4rem; /* Título gigante estilo portada */
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(139, 233, 253, 0.4);
            font-weight: 400;
        }

        .gallery-header p { 
            color: #bd93f9; 
            font-size: 1.5rem; /* Subtítulo legible */
        }

        /* --- 4. GRILLA DE FOTOS --- */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 50px; /* Más separación entre fotos */
            padding: 20px 80px 150px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .photo-card {
            background-color: #1a1a24;
            border: 1px solid #44475a;
            border-radius: 4px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .photo-card:hover {
            transform: translateY(-8px);
            border-color: #50fa7b;
            box-shadow: 0 0 25px rgba(80, 250, 123, 0.3); /* Resplandor verde en la tarjeta */
        }

        .img-wrapper {
            width: 100%;
            height: 300px; /* Fotos más altas */
            overflow: hidden;
            border-bottom: 1px solid #282a36;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            opacity: 0.9;
        }

        .photo-card:hover img { transform: scale(1.1); opacity: 1; }

        .card-info { padding: 20px; }
        .card-title { display: block; color: #f8f8f2; font-size: 1.6rem; margin-bottom: 5px; }
        .card-tech { display: block; color: #6272a4; font-size: 1.1rem; }

        /* --- 5. MODAL --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 15, 22, 0.98);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            max-width: 90%;
            max-height: 80vh;
            border: 2px solid #50fa7b;
            box-shadow: 0 0 60px rgba(80, 250, 123, 0.15);
        }

        .close-btn {
            position: absolute;
            top: 30px;
            right: 50px;
            color: #fff;
            font-size: 60px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .modal-caption {
            margin-top: 25px;
            color: #f8f8f2;
            background: #282a36;
            padding: 15px 30px;
            border-left: 5px solid #bd93f9;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <nav class="cyber-nav">
        <div class="nav-logo">
            <span style="color: #50fa7b;">➜</span> ETHER_SENTRY
        </div>
        <ul class="nav-links">
            <li><a href="index.html">/ROOT</a></li>
            <li><a href="galeria.html" class="active">/GALERÍA</a></li> <li><a href="index.html#proyectos">/PROYECTOS</a></li>
            <li><a href="mailto:tuemail@gmail.com">/CONTACTO</a></li>
        </ul>
    </nav>

    <header class="gallery-header">
        <h1>Registros Visuales</h1>
        <p>[ Fotografía de Producto / Ingeniería / Coleccionismo ]</p>
    </header>

    <div class="gallery-container">
        
        <div class="photo-card" onclick="openModal(this)" data-desc="Mega Charizard X - Iluminación de Estudio">
            <div class="img-wrapper">
                <img src="charizard.jpg" alt="Charizard UPC">
            </div>
            <div class="card-info">
                <span class="card-title">Mega Charizard X</span>
                <span class="card-tech">Canon Rebel T5 | 50mm | ISO 100</span>
            </div>
        </div>

        <div class="photo-card" onclick="openModal(this)" data-desc="Kyurem Black - Render de Terminal">
            <div class="img-wrapper">
                <img src="kyurem.png" alt="Kyurem">
            </div>
            <div class="card-info">
                <span class="card-title">Project Kyurem</span>
                <span class="card-tech">Digital Asset | High Contrast</span>
            </div>
        </div>

        <div class="photo-card" onclick="openModal(this)" data-desc="Estación de Trabajo Garuda Linux">
            <div class="img-wrapper">
                <img src="setup.jpg" alt="Setup">
            </div>
            <div class="card-info">
                <span class="card-title">Workstation</span>
                <span class="card-tech">Garuda Linux | Dr460nized</span>
            </div>
        </div>

        </div>

    <div id="myModal" class="modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="img01">
        <div id="caption" class="modal-caption"></div>
    </div>

    <script>
        function openModal(card) {
            const modal = document.getElementById("myModal");
            const modalImg = document.getElementById("img01");
            const captionText = document.getElementById("caption");
            
            const img = card.querySelector('img');
            const desc = card.getAttribute('data-desc');

            modal.style.display = "flex";
            modalImg.src = img.src;
            captionText.innerHTML = "► SYSTEM LOG: " + desc;
        }

        function closeModal() {
            document.getElementById("myModal").style.display = "none";
        }
        
        window.onclick = function(event) {
            const modal = document.getElementById("myModal");
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
